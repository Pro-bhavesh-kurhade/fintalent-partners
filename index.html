<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinTalent Partners - Fast-Track Finance, CA & Tax Hiring Across India</title>
    <meta
      name="description"
      content="Zero-turnaround finance recruitment studio. Browse live CA, Audit, Tax, FP&A & Articleship roles, apply in 60 seconds, or hire pre-vetted finance talent in 48 hours."
    />
    <meta property="og:title" content="FinTalent Partners - Modern Finance & CA Talent Studio" />
    <meta
      property="og:description"
      content="Instant job discovery & 48-hour pre-vetted shortlists for Chartered Accountants, Tax Leads, FP&A Analysts, and Leading Firms."
    />
    <meta property="og:image" content="%BASE_URL%images/hero-finance-studio.jpg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const route = params.get('route');
        if (!route) return;
        const basePath = '%BASE_URL%'.replace(/\/$/, '');
        const pathname = route.startsWith('/') ? route : `/${route}`;
        const search = params.get('search') || '';
        const hash = params.get('hash') || '';
        window.history.replaceState(null, '', `${basePath}${pathname}${search}${hash}`);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
